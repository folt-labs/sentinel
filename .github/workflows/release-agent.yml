name: Release Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd agent
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }} -X main.buildTime=${BUILD_TIME}" \
            -o ../sentinel-agent-${{ matrix.suffix }} \
            ./cmd/serverguard-agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-agent-${{ matrix.suffix }}
          path: sentinel-agent-${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/sentinel-agent-linux-amd64/sentinel-agent-linux-amd64 release/
          cp artifacts/sentinel-agent-linux-arm64/sentinel-agent-linux-arm64 release/
          cp install.sh release/
          chmod +x release/*

          # Create checksums
          cd release
          sha256sum sentinel-agent-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Sentinel Agent ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            release/sentinel-agent-linux-amd64
            release/sentinel-agent-linux-arm64
            release/install.sh
            release/checksums.txt
          body: |
            ## Installation

            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash -s -- YOUR_API_KEY https://your-api-url
            ```

            ## What's Changed

            See commit history for changes in this release.
